[plugin]
name = "agent-gates"
version = "0.1.0"
description = "Checks a coding agent's turn against a repo's stated rules, from a Claude Code Stop hook."
package = "otari_agent_gates"
plugin_api = 1
modes = ["standalone"]
homepage = "https://github.com/mozilla-ai/otari-agent-gates"
getting_started = "https://github.com/mozilla-ai/otari-agent-gates#quick-start"
contributes = ["routes", "cli", "migrations", "ui", "traffic"]
config_keys = ["traffic"]

[plugin.settings.judge_timeout_seconds]
type = "int"
default = 120
description = "Cap on one subscription-backend judge call, in seconds."

[[plugin.pages]]
id = "gates"
label = "Agent gates"
path = "static"
section = "build"
parent = "tools"
icon = "shield"
